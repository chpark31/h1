:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#e7edf7;background:#0c1423}*{box-sizing:border-box}body{margin:0}header{padding:30px 5vw;background:linear-gradient(110deg,#142744,#162033);border-bottom:1px solid #293d58}header h1{font-size:clamp(23px,3vw,36px);margin:0 0 10px}header p{color:#a9bbd0;margin:0}.wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.85fr);gap:22px;max-width:1500px;margin:auto;padding:24px}.panel{background:#152237;border:1px solid #2b3d56;border-radius:14px;overflow:hidden}.pad{padding:19px}.bar{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}button{background:#243c59;border:1px solid #45617e;color:#f5f8ff;border-radius:8px;padding:10px 13px;cursor:pointer;font-weight:650}button:hover{background:#365477}button.primary{background:#2a70b9;border-color:#3893e9}.titleline{display:flex;align-items:center;justify-content:space-between;gap:10px}.count{color:#8fb7e4;font-size:13px}details{border-top:1px solid #2a3c53}summary{padding:17px 19px;cursor:pointer;font-weight:750;list-style:none;display:flex;justify-content:space-between}summary::-webkit-details-marker{display:none}summary:hover{background:#192a43}.stepcount{font-weight:500;color:#9cb5d1;font-size:13px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:0 16px 16px;gap:8px}.opt{display:flex;align-items:flex-start;gap:9px;border:1px solid #33455a;padding:10px;border-radius:9px;cursor:pointer;background:#192a41;min-height:59px}.opt:hover{border-color:#71a3e0}.opt:has(input:checked){border-color:#69abf5;background:#1a3659}.opt input{margin-top:3px;accent-color:#62b3ff}.en{display:block;font-size:13px;font-weight:680}.ko{display:block;font-size:12px;color:#a9bbd0;margin-top:3px}.sticky{position:sticky;top:20px;align-self:start}.note{font-size:13px;color:#b0c3d7;line-height:1.6}.warn{font-size:13px;color:#ffcb81;margin:8px 0;white-space:pre-wrap}textarea{width:100%;min-height:460px;resize:vertical;background:#0a1525;color:# </style></head><body><header><h1>천궁(KM-SAM) 이미지 프롬프트 생성기</h1><p>원본 Markdown의 7단계 · 140개 키워드 기반 | 키워드를 선택하면 영문 이미지 생성 프롬프트 자동 구성</p></header><div class="wrap"><section class="panel"><div class="pad"><div class="titleline"><strong>키워드 선택</strong><span class="count" id="total">0 / 140 선택</span></div><div class="bar"><button data-preset="launch">천궁-II 발사 장면</button><button data-preset="radar">다기능레이다</button><button data-preset="control">교전통제소</button><button id="reset">전체 해제</button></div><input class="search" id="search" placeholder="영문·한글 키워드 검색" aria-label="키워드 검색"><p class="small">키워드는 복수 선택할 수 있습니다. 단계 제목을 누르면 펼쳐집니다.</p></div><div id="steps"></div></section><aside class="panel sticky"><div class="pad"><div class="titleline"><strong>완성된 영문 프롬프트</strong><span class="count" id="selected">0개 적용</span></div><p id="warning" class="warn"></p><textarea id="prompt" aria-label="완성 프롬프트" spellcheck="false"></textarea><div class="bar"><button class="primary" id="copy">프롬프트 복사</button><button id="save">TXT 저장</button><button id="update">선택사항으로 다시 생성</button></div><p class="note">외형 정확도를 높이려면 실물 기준 사진과 대조하세요. 천궁-I/II 또는 발사대/레이다/교전통제소 등 서로 다른 장비의 특징을 함께 사용하지 않도록 주의해야 합니다.</p><p class="small" id="status"></p></div></aside></div><script>
const steps=[{"num": 1, "name": "무기체계 및 장비 정의", "english": "Subject", "items": [{"en": "KM-SAM", "ko": "천궁"}, {"en": "Cheongung-I", "ko": "천궁-I"}, {"en": "Cheongung-II", "ko": "천궁-II"}, {"en": "KM-SAM Block-I", "ko": "천궁 초기형"}, {"en": "KM-SAM Block-II", "ko": "천궁 개량형"}, {"en": "Medium-Range Surface-to-Air Missile System", "ko": "중거리 지대공유도무기체계"}, {"en": "Ground-Based Air Defense System", "ko": "지상기반 방공체계"}, {"en": "Mobile Air Defense System", "ko": "이동형 방공체계"}, {"en": "Missile Launch Vehicle", "ko": "유도탄 발사차량"}, {"en": "Transporter Erector Launcher (TEL)", "ko": "이동식 발사대"}, {"en": "Vertical Launch System", "ko": "수직발사체계"}, {"en": "Missile Launch Canister", "ko": "유도탄 발사관"}, {"en": "Multifunction Radar (MFR)", "ko": "다기능레이다"}, {"en": "Phased-Array Radar", "ko": "위상배열레이다"}, {"en": "Radar Antenna Assembly", "ko": "레이다 안테나 구성품"}, {"en": "Engagement Control Center (ECC)", "ko": "교전통제소"}, {"en": "Command and Control Vehicle", "ko": "지휘통제차량"}, {"en": "Mobile Command Shelter", "ko": "이동형 지휘통제 쉘터"}, {"en": "Air Defense Missile Battery", "ko": "방공유도탄 포대"}, {"en": "Integrated Air Defense System", "ko": "통합방공체계"}]}, {"num": 2, "name": "구조 및 외형", "english": "Structural Accuracy", "items": [{"en": "Accurate System Geometry", "ko": "정확한 체계 형상"}, {"en": "Authentic Military Vehicle Proportions", "ko": "실제 군용차량 비례"}, {"en": "Eight Vertical Launch Canisters", "ko": "수직 발사관 8기"}, {"en": "Rectangular Launch Canister Arrangement", "ko": "직사각형 발사관 배열"}, {"en": "Vertical Missile Launch Configuration", "ko": "수직 유도탄 발사 구성"}, {"en": "Vehicle-Mounted Launching Platform", "ko": "차량 탑재형 발사 플랫폼"}, {"en": "Heavy-Duty Military Truck Chassis", "ko": "중대형 군용 트럭 차체"}, {"en": "Multi-Axle Wheeled Vehicle", "ko": "다축 차륜형 차량"}, {"en": "Realistic Tire Tread Pattern", "ko": "사실적인 타이어 트레드"}, {"en": "Hydraulic Stabilizing Outriggers", "ko": "유압식 지지장치"}, {"en": "Radar Antenna Panel", "ko": "레이다 안테나 패널"}, {"en": "Phased-Array Antenna Surface", "ko": "위상배열 안테나 표면"}, {"en": "Radar Support Structure", "ko": "레이다 지 o": "기록사진 스타일"}, {"en": "Cinematic Lighting", "ko": "영화적 조명"}, {"en": "Natural Lighting", "ko": "자연광"}, {"en": "Soft Diffused Lighting", "ko": "부드러운 확산광"}, {"en": "High Dynamic Range (HDR)", "ko": "넓은 명암 표현"}, {"en": "Realistic Shadows", "ko": "사실적인 그림자"}, {"en": "Physically Based Rendering (PBR)", "ko": "물리 기반 재질 표현"}, {"en": "Realistic Metallic Textures", "ko": "사실적인 금속 질감"}, {"en": "Weathered Military Paint", "ko": "사용감 있는 군용 도색"}, {"en": "Atmospheric Perspective", "ko": "대기 원근감"}, {"en": "Volumetric Lighting", "ko": "입체적 광선 표현"}, {"en": "High-Contrast Composition", "ko": "강한 명암 대비"}, {"en": "Technical Product Visualization", "ko": "기술 제품 시각화"}]}, {"num": 7, "name": "오류 방지", "english": "Negative Constraints", "items": [{"en": "No Duplicate Launch Canisters", "ko": "중복 발사관 금지"}, {"en": "No Incorrect Canister Arrangement", "ko": "잘못된 발사관 배열 금지"}, {"en": "No Deformed Missile Tubes", "ko": "발사관 형태 왜곡 금지"}, {"en": "No Incorrect Vehicle Proportions", "ko": "차체 비례 오류 금지"}, {"en": "No Extra Wheels", "ko": "불필요한 바퀴 추가 금지"}, {"en": "No Missing Wheels", "ko": "바퀴 누락 금지"}, {"en": "No Deformed Tires", "ko": "타이어 왜곡 금지"}, {"en": "No Floating Vehicle", "ko": "차량이 지면에 뜨는 오류 금지"}, {"en": "No Incorrect Radar Antenna", "ko": "부정확한 레이다 안테나 금지"}, {"en": "No Fictional Radar Components", "ko": "가상의 레이다 구성품 금지"}, {"en": "No Fictional Weapons", "ko": "실제 없는 무장 추가 금지"}, {"en": "No Mixed Missile System Designs", "ko": "다른 유도무기체계 디자인 혼합 금지"}, {"en": "No Patriot Launcher Features", "ko": "패트리어트 발사대 특징 혼합 금지"}, {"en": "No THAAD Launcher Features", "ko": "사드 발사대 특징 혼합 금지"}, {"en": "No Unrealistic Missile Geometry", "ko": "비현실적 유도탄 형상 금지"}, {"en": "No Exaggerated Muzzle Fire", "ko": "과장된 포구 화염 표현 금지"}, {"en": "No Unrealistic Explosions", "ko": "비현실적인 폭발 표현 금지"}, {"en": "No Distorted Perspective", "ko": "원근 왜곡 금지"}, {"en": "No Text or Watermarks", "ko": "문자·워터마크 금지"}, {"en": "No Inaccurate Military Markings", "ko": "부정확한 군 표식 금지"}]}];
const selected=new Set();
const stepArea=document.getElementById('steps'),textArea=document.getElementById('prompt');
const initial={launch:['KM-SAM Block-II','Missile Launch Vehicle','Vertical Launch System','Accurate System Geometry','Eight Vertical Launch Canisters','Authentic Military Vehicle Proportions','Reference-Accurate Exterior Details','Cold Launch Sequence','Missile Ascending Vertically','Realistic Launch Smoke','Military Training Ground','Nighttime Environment','Aerial Oblique View','Full Vehicle Shot','Photorealistic','Professional Military Photography','Realistic Shadows','High-Fidelity Details','No Duplicate Launch Canisters','No Incorrect Canister Arrangement','No Mixed Missile System Designs','No Unrealistic Missile Geometry','No Text or Watermarks'],radar:['KM-SAM Block-II','Multifunction Radar (MFR)','Phased-Array Radar','Accurate System Geometry','Radar Antenna Panel','Phased-Array Antenna Surface','Radar Support Structure','Reference-Accurate Exterior Details','Radar Surveillance Operation','Military Training Ground','Front Three-Quarter View','Full Vehicle Shot','Photorealistic','High-Fidelity Details','No Incorrect Radar Antenna','No Fictional Radar Components','No Mixed Missile System Designs','No Text or Watermarks'],control:['KM-SAM Block-II','Engagement Control Center (ECC)','Mobile Command Shelter','Accurate System Geometry','Mobile Command Shelter Body','Military Communication Antennas','Reference-Accurate Exterior Details','Command Center Operation','Military Training Ground','Front Three-Quarter View','Full Vehicle Shot','Photorealistic','High-Fidelity Details','No Mixed Missile System Designs','No Text or Watermarks']};
const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=document.getElementById('search').value.trim().toLowerCase();stepArea.innerHTML='';steps.forEach((s,si)=>{const el=document.createElement('details');el.open=!q ? si<2 : true;const visible=s.items.filter(x=>(x.en+' '+x.ko).toLowerCase().includes(q));if(q&&!visible.length)return;const cnt=s.items.filter(x=>selected.has(x.en)).length;el.innerHTML=`<summary><span>STEP ${s.num} · ${escapeHtml(s.name)} <span class="small">(${escapeHtml(s.english)})</span></span><span class="stepcount">${cnt} / ${s.items.length}</span></summary><div class="options">${visible.map(x=>`<label class="opt"><input type="checkbox" data-en="${escapeHtml(x.en)}" ${selected.has(x.en)?'checked':''}><span><span class="en">${escapeHtml(x.en)}</span><span class="ko">${escapeHtml(x.ko)}</span></span></label>`).join('')}</div>`;stepArea.append(el)});document.getElementById('total').textContent=`${selected.size} / 140 선택`;document.getElementById('selected').textContent=`${selected.size}개 적용`;}
function gen(){const picks=steps.map(s=>s.items.filter(x=>selected.has(x.en)).map(x=>x.en));const subject=picks[0].join(', ')||'KM-SAM air defense equipment';const names=['System and Equipment','Structural Accuracy','Operational State','Environment','Camera and Composition','Visual Quality','Negative Constraints'];let out=`Create a photorealistic image of the ${subject}.\n\n`;picks.forEach((items,i)=>{out+=`[${i+1}. ${names[i]}]\n${items.length?items.join(', ')+'.':'[Select relevant keywords]'}\n`;if(i===1)out+='Match the selected production variant using verified exterior reference photographs.\n';out+='\n'});textArea.value=out.trim();const warnings=[];if(selected.has('Cheongung-I')&&selected.has('Cheongung-II')||selected.has('KM-SAM Block-I')&&selected.has('KM-SAM Block-II'))warnings.push('⚠ 천궁-I과 천궁-II가 동시에 선택되었습니다.');const roles=['Missile Launch Vehicle','Multifunction Radar (MFR)','Engagement Control Center (ECC)'].filter(x=>selected.has(x));if(roles.length>1)warnings.push('⚠ 발사대·레이다·교전통제소가 함께 선택되었습니다.');document.getElementById('warning').textContent=warnings.join('\n');}
function refresh(){render();gen()};stepArea.addEventListener('change',e=>{if(e.target.matches('input[type=checkbox]')){if(e.target.checked)selected.add(e.target.dataset.en);else selected.delete(e.target.dataset.en);refresh()}});document.getElementById('search').addEventListener('input',render);document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{selected.clear();initial[b.dataset.preset].forEach(x=>selected.add(x));document.getElementById('search').value='';refresh();document.getElementById('status').textContent='예시 키워드를 적용했습니다.'}));document.getElementById('reset').onclick=()=>{selected.clear();refresh()};document.getElementById('update').onclick=gen;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(textArea.value);document.getElementById('status').textContent='클립보드에 복사했습니다.'}catch(e){textArea.select();document.execCommand('copy');document.getElementById('status').textContent='프롬프트를 선택했습니다. Ctrl+C로 복사할 수 있습니다.'}};document.getElementById('save').onclick=()=>{const a=document.createElement('a');const u=URL.createObjectURL(new Blob([textArea.value],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='KM-SAM_image_prompt.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};refresh();
